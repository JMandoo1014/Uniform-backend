# 컨테이너 로그(접속 IP·User-Agent가 담기는 nginx 접근 로그 포함)가 무한히
# 쌓이지 않게 서비스당 최대 10MB × 5개(50MB)까지만 보관한다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *default-logging
    image: postgres:15
    container_name: uniform-postgres
    restart: unless-stopped
    # 계정 정보는 저장소에 두지 않고 같은 폴더의 .env에서 읽는다. 값이 없으면
    # compose가 바로 멈추므로(빈 비밀번호로 뜨는 일 없음) .env.example 참고.
    # 주의: POSTGRES_* 는 볼륨을 처음 만들 때만 쓰인다 — 이미 있는 DB의 비밀번호는
    # 여기 값을 바꿔도 안 바뀌고 ALTER USER로 바꿔야 한다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
    # 이 머신 안에서만 접속 가능(127.0.0.1). 0.0.0.0으로 열면 Docker가 ufw를
    # 우회해 외부에 그대로 노출된다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - uniform_postgres_data:/var/lib/postgresql/data

volumes:
  uniform_postgres_data:
