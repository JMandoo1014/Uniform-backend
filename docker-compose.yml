services:
  postgres:
    image: postgres:15
    container_name: uniform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniform
      POSTGRES_PASSWORD: uniform
      POSTGRES_DB: uniform_dev
    ports:
      - "5432:5432"
    volumes:
      - uniform_postgres_data:/var/lib/postgresql/data

volumes:
  uniform_postgres_data:
