# Cloudflare 뒤에 있으므로 연결 상대(Cloudflare 엣지) IP 대신 실제 접속자 IP를
# $remote_addr로 쓴다. 아래 대역에서 온 요청의 CF-Connecting-IP만 믿는다(다른
# 출처가 보낸 헤더는 무시되어 위조할 수 없다). 대역은 Cloudflare 공식 목록
# https://www.cloudflare.com/ips-v4 , /ips-v6 기준(2026-10-06 확인) — 바뀌면 갱신.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    # 80은 Cloudflare SSL 모드를 Full (strict)로 바꾸기 전까지 유지한다 — 그 전엔
    # Cloudflare가 오리진에 80으로 붙을 수 있어 닫으면 서비스가 끊긴다.
    listen 80;
    # Cloudflare Origin 인증서 — Cloudflare만 신뢰하는 인증서라 브라우저가 직접
    # 붙으면 경고가 난다(정상). 호스트의 /etc/uniform/ssl을 읽기 전용으로 마운트.
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 전체를 그대로 넘긴다 — /api-docs, /api-docs-json 포함 모든 경로가
    # 이 하나의 location으로 커버된다.
    location / {
        proxy_pass http://app:3000;
        # FormMate(Gemini) 응답이 길어질 수 있다. Cloudflare의 오리진 응답
        # 대기 한도(100s)보다 짧게 둬서 nginx가 먼저 504를 낸다.
        proxy_read_timeout 90s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
