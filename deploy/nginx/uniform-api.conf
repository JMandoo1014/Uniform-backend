# 운영 API (api.uniform-app.com) — 호스트 nginx 사이트. 앱은 127.0.0.1:3000에서 받는다(외부에 직접 열지 않음).
# 설치 위치: /etc/nginx/sites-available/uniform-api (설치·활성화 절차는 deploy/nginx/README.md)
# TLS는 Cloudflare Origin 인증서(/etc/uniform/ssl)로 받는다 — Cloudflare만 신뢰하는 인증서라
# 브라우저가 오리진에 직접 붙으면 경고가 난다(정상). Cloudflare SSL 모드는 Full (strict).
server {
    # 80은 Cloudflare SSL 모드를 Full (strict)로 바꾸기 전까지 유지한다 — 그 전엔
    # Cloudflare가 오리진에 80으로 붙을 수 있어 닫으면 서비스가 끊긴다.
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.uniform-app.com;

    ssl_certificate     /etc/uniform/ssl/origin.pem;
    ssl_certificate_key /etc/uniform/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # 전체를 그대로 넘긴다 — /api-docs, /api-docs-json 포함 모든 경로가 이 하나의 location으로 커버된다.
    location / {
        proxy_pass http://127.0.0.1:3000;
        # FormMate(Gemini) 응답이 길어질 수 있다. Cloudflare의 오리진 응답
        # 대기 한도(100s)보다 짧게 둬서 nginx가 먼저 504를 낸다.
        proxy_read_timeout 90s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
